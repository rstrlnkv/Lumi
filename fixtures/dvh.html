<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dvh / svh / lvh check</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  .unit { box-sizing: border-box; border: 2px solid #06c; padding: 8px; margin: 0 0 16px; }
  .dvh { height: 100dvh; background: #cde; }
  .svh { height: 100svh; background: #dec; }
  .lvh { height: 100lvh; background: #ecd; }
  .filler { height: 800px; background: repeating-linear-gradient(#fff, #fff 40px, #eee 40px, #eee 80px); }
  #fixed {
    position: fixed; bottom: 0; left: 0; right: 0; height: 48px;
    background: #d22; color: #fff; display: flex; align-items: center; justify-content: center;
  }
  #sizes { position: fixed; top: 0; left: 0; background: #000a; color: #fff; padding: 4px 8px; font: 12px monospace; }
</style>
</head>
<body>
<div id="sizes"></div>
<div class="unit dvh">100dvh: its bottom edge should sit right above the address bar (expanded or collapsed).</div>
<div class="unit svh">100svh: smallest viewport (bar fully shown).</div>
<div class="unit lvh">100lvh: largest viewport (bar fully hidden).</div>
<div class="filler">Scroll to see the bar collapse and expand.</div>
<div id="fixed">fixed bottom:0 - must stay just above the address bar</div>
<script>
  const out = document.getElementById('sizes');
  function show() {
    out.textContent = 'innerHeight ' + innerHeight + ' / visualViewport.height ' +
      Math.round(visualViewport.height);
  }
  addEventListener('resize', show);
  visualViewport.addEventListener('resize', show);
  setInterval(show, 250);
  show();
</script>
</body>
</html>
